<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#f5f0e6" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle grid borders -->
  <g stroke="#e6decb" stroke-width="1" opacity="0.6">
    <line x1="120" y1="0" x2="120" y2="630" />
    <line x1="1080" y1="0" x2="1080" y2="630" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="540" x2="1200" y2="540" />
  </g>

  <!-- Inner Card -->
  <rect x="120" y="90" width="960" height="450" rx="24" fill="#ffffff" stroke="#d6c7af" stroke-width="2" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.06))" />

  <!-- Top Badge -->
  <rect x="180" y="140" width="280" height="36" rx="18" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5" />
  <text x="320" y="163" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#92400e" letter-spacing="1">GOURMET &amp; WARENKUNDE</text>

  <!-- Main Title -->
  <text x="180" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#292524" letter-spacing="-1">
    Sommertrüffel.de
  </text>

  <!-- Subtitle -->
  <text x="180" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#44403c">
    Tuber aestivum: Kaufberater, Frischetest &amp; Saisonkalender
  </text>

  <text x="180" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#78716c">
    Präziser Portionsrechner, Lagerungsregeln &amp; traditionelle Rezeptideen
  </text>

  <!-- Feature Pills -->
  <g transform="translate(180, 390)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="230" height="44" rx="12" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.5" />
    <text x="115" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#292524">⚖️ Portions-Rechner</text>

    <!-- Pill 2 -->
    <rect x="245" y="0" width="230" height="44" rx="12" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.5" />
    <text x="360" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#292524">📅 Saison &amp; Ernte</text>

    <!-- Pill 3 -->
    <rect x="490" y="0" width="230" height="44" rx="12" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.5" />
    <text x="605" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#292524">🔍 Frische-Kaufcheck</text>
  </g>

  <!-- Bottom Brand Footnote -->
  <text x="180" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#a8a29e">
    https://www.sommertrueffel.de · Unabhängiger Ratgeber
  </text>
</svg>
